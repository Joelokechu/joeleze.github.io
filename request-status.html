<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />

  <title>Track your request | Insights by Joel</title>

  <link rel="stylesheet" href="style.css" />

  <script defer src="ticket-config.js"></script>
  <script defer src="tickets.js"></script>
</head>

<body>
  <main class="ticket-shell">
    <a href="index.html">Insights by Joel</a>

    <h1>Track your request</h1>

    <p>
      This link is private. Keep it so you can return for updates.
    </p>

    <div
      id="ticket-result"
      class="ticket-box"
      role="status"
      aria-live="polite"
    >
      Loading your request…
    </div>

    <button id="refresh-status" type="button">
      Refresh status
    </button>

    <p>
      <a href="mailto:Joel.okechu@gmail.com">
        Contact Joel
      </a>
    </p>
  </main>
</body>
</html>
